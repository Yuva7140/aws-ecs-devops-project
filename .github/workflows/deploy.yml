name: Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops-demo-app

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::041073296018:role/GitHub-Role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t devops-demo-app .

      - name: Tag Docker image
        run: |
          docker tag devops-demo-app:latest 041073296018.dkr.ecr.us-east-1.amazonaws.com/devops-demo-app:latest

      - name: Push Docker image
        run: |
          docker push 041073296018.dkr.ecr.us-east-1.amazonaws.com/devops-demo-app:latest
